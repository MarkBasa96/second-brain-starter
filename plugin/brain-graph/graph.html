<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Brain Graph</title>
<style>
/* Layout: full-bleed 3D brain of the vault over a living night sky; frosted-glass HUD cards in the corners */
:root{
  --void:#03040a; --glass-hi:rgba(255,255,255,.09); --glass-lo:rgba(140,170,230,.035); --glass-edge:rgba(255,255,255,.13);
  --ink:#dfe6f5; --mute:#7c87a0; --amber:#f2c27b;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace; --sans:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;font-family:var(--sans);font-size:14px}
#sky{position:fixed;inset:-4%;pointer-events:none;background:#03040a center/cover no-repeat;opacity:.3;filter:saturate(.8);animation:skydrift 120s linear infinite alternate}
@keyframes skydrift{to{transform:scale(1.06) translate(-1.5%,1%)}}
#stars,#stage{position:fixed;inset:0}
#stars{pointer-events:none}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 38%,rgba(0,0,0,.82))}
@media (prefers-reduced-motion:reduce){#sky{animation:none}}
/* Frosted glass: see-through tint, heavy blur of the sky behind, a lit top edge */
.card{position:fixed;border-radius:14px;background:linear-gradient(145deg,var(--glass-hi),var(--glass-lo));border:1px solid var(--glass-edge);
  backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),inset 0 -1px 0 rgba(255,255,255,.03),0 12px 40px rgba(0,0,0,.45)}
#hud{top:14px;left:16px;padding:10px 16px}
#hud h1{margin:0 0 4px;font:700 13px/1.2 var(--mono);letter-spacing:.14em}
#hud p{margin:0;font:400 12px var(--mono);color:var(--mute)}
#hud b{color:var(--ink);font-weight:700}
#rescan{position:fixed;top:14px;right:16px;padding:7px 12px;font:400 11px var(--mono);letter-spacing:.1em;color:var(--amber);cursor:pointer}
#rescan:hover{color:#fff}
#legend{bottom:14px;left:16px;width:290px;max-width:calc(100vw - 32px);padding:10px 14px;font-size:12px}
#legend header{display:flex;justify-content:space-between;font:400 11px var(--mono);letter-spacing:.14em;color:var(--mute);margin-bottom:6px}
#legend button{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:0}
#legend ul{list-style:none;margin:0;padding:0;display:grid;gap:3px;max-height:42vh;overflow-y:auto;overflow-x:hidden;padding-right:6px;scrollbar-width:thin}
#legend li{display:flex;align-items:center;gap:8px;cursor:pointer;padding:2px 6px;margin:0 -6px;border-radius:6px;transition:background .2s}
#legend li:hover,#legend li.on{background:rgba(255,255,255,.08)}
#legend li span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#legend li span:last-child{margin-left:auto;font-family:var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
#legend i{width:7px;height:7px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
#hint{bottom:14px;right:16px;padding:8px 12px;font:400 11px var(--mono);color:var(--mute)}
#tip{pointer-events:none;padding:8px 12px;max-width:280px;font-size:13px;font-weight:600;border-radius:12px;z-index:5}
#tip small{display:block;font-weight:400;font-size:11px;color:var(--mute);margin-top:3px}
#tip small i{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px}
#tip em{font-style:normal;color:var(--amber)}
/* "Learned" toast: slides up when new notes arrive, fades after a few seconds */
#learn{left:50%;bottom:22px;transform:translate(-50%,12px);padding:9px 16px;max-width:min(460px,calc(100vw - 32px));opacity:0;pointer-events:none;
  transition:opacity .5s,transform .5s;display:flex;gap:10px;align-items:baseline;font-size:13px}
#learn.show{opacity:1;transform:translate(-50%,0)}
#learn span:first-child{font:700 11px var(--mono);letter-spacing:.14em;color:var(--amber);flex:none}
#learn span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:640px){#hint{display:none}#legend{width:210px}}
</style>
</head>
<body>
<div id="sky"></div>
<canvas id="stars"></canvas>
<div id="stage"></div>
<div id="vignette"></div>
<div id="hud" class="card"><h1>KNOWLEDGE GRAPH</h1><p><b id="nN">0</b> notes / <b id="nE">0</b> links / <b id="nC">0</b> communities</p></div>
<div id="rescan" class="card" role="button" tabindex="0">RESCAN VAULT</div>
<div id="legend" class="card"><header><span>LABELED COMMUNITIES</span><button id="hide" type="button">hide</button></header><ul id="list"></ul></div>
<div id="hint" class="card">drag orbit / scroll zoom / click a note to open / F full screen</div>
<div id="tip" class="card" hidden></div>
<div id="learn" class="card" aria-live="polite"><span>LEARNED</span><span id="learnText"></span></div>

<script>/*__THREE__*/</script>
<script>/*__ORBIT__*/</script>
<script>
// DATA comes from the plugin: real notes, real links, communities by folder.
// Later changes arrive as "update" messages and are merged in place (camera untouched).
const DATA=/*__DATA__*/{"nodes":[],"edges":[],"comms":[]};
// Night sky: painted once on a canvas (no image files), so the plugin ships without any photo
(function paintSky(){
  const c=document.createElement('canvas');c.width=1280;c.height=720;const g=c.getContext('2d');
  g.fillStyle='#03040a';g.fillRect(0,0,1280,720);
  let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;
  g.save();g.translate(640,360);g.rotate(-.42);
  for(let i=0;i<46;i++){const x=(r()-.5)*1500,y=(r()-.5)*170*(1-Math.abs(x)/1100),rad=90+r()*190;
    const gr=g.createRadialGradient(x,y,0,x,y,rad),col=['120,150,255','190,140,255','255,200,140','110,220,230'][Math.floor(r()*4)];
    gr.addColorStop(0,`rgba(${col},${.05+r()*.07})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.fillRect(x-rad,y-rad,rad*2,rad*2)}
  g.restore();
  for(let i=0;i<1400;i++){g.globalAlpha=.15+r()*.6;g.fillStyle=r()<.2?'#ffd9a8':'#cfe0ff';g.fillRect(r()*1280,r()*720,r()<.06?2:1,r()<.06?2:1)}
  document.getElementById('sky').style.backgroundImage='url('+c.toDataURL('image/jpeg',.82)+')';
})();
const post=m=>parent.postMessage(Object.assign({src:'brain-graph'},m),'*');

// Each community keeps its colour for the life of the tab, even as others come and go
const PALETTE=["#f2c27b","#5fe3e0","#9fb4ff","#ff8a6b","#c99bff","#7ee8a5","#ffd36e","#6fb8ff","#ff9ec7","#b8f27b","#7be0ff","#e8a6ff","#ffb36b","#8fffd2","#a3a8ff","#ffe08f"];
const colorOf={};let nextColor=0;
function commColor(key){if(key==='core')return'#fff4dc';if(!(key in colorOf))colorOf[key]=PALETTE[nextColor++%PALETTE.length];return colorOf[key]}

let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;

// Brain geometry: two hemispheres split by a groove, wrinkled cortex, flat base,
// temporal lobes, cerebellum. x = left/right, y = up, z = front (+) / back (-)
function dir(){const z=rnd()*2-1,a=rnd()*6.283,r=Math.sqrt(1-z*z);return[r*Math.cos(a),z,r*Math.sin(a)]}
function cortexPoint(surface){
  for(;;){
    if(rnd()<.11){const[dx,dy,dz]=dir(),s=surface?.85+rnd()*.15:rnd(),f=1+.05*Math.sin(dy*40);return[dx*.5*s*f,dy*.24*s-.52,dz*.3*s-.68]}
    const[dx,dy,dz]=dir();
    const s=surface?(rnd()<.85?.94+rnd()*.06:.4+rnd()*.5):.3+rnd()*.7;
    const th=Math.atan2(dz,dx),ph=Math.asin(dy);
    const gyri=1+.055*Math.sin(th*13+Math.sin(ph*7)*2.5)*Math.sin(ph*11+Math.cos(th*5));
    let x=dx*.72,y=dy*.66,z=dz*1.02;
    if(y<-.2)y=-.2+(y+.2)*.45;
    if(y<.02&&z>-.45&&z<.5)y-=.16*Math.cos((z-.02)*3.2);
    if(z>.5)y-=.08*(z-.5)*3;
    x*=s*gyri;y*=s*gyri;z*=s*gyri;
    if(Math.abs(x)<.045&&y>-.05&&s>.9)continue;
    x+=Math.sign(x)*.035;
    return[x,y,z];
  }
}
function stemPoint(k,n){const t=n>1?k/(n-1):.5,a=k*2.4,r=.04+.06*rnd();return[Math.cos(a)*r,-.42-t*.5,Math.sin(a)*r-.3]}

// Placement: core files run down the brainstem; every other community claims one contiguous
// patch of cortex (its most-linked notes at the centre). Spots are kept per note id, so an
// update never moves a note you already know; a ghost that gets written keeps its ghost's spot.
const SCALE=260,d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2;
const cand=[],centers={},known=new Map();
function ensureFree(n){let free=cand.reduce((k,c)=>k+!c.used,0);while(free<n+10){cand.push({p:cortexPoint(true),used:false});free++}}
function newCenter(){const cs=Object.values(centers);let best=null,bd=-1;
  for(const c of cand){if(c.used)continue;let m=cs.length?Infinity:rnd();for(const q of cs)m=Math.min(m,d2(c.p,q));if(m>bd){bd=m;best=c}}return best.p}
function nearestFree(center){let best=null,bd=Infinity;for(const c of cand){if(c.used)continue;const d=d2(c.p,center);if(d<bd){bd=d;best=c}}best.used=true;return best}

let COMM=[],comIndex={},nodes=[],edges=[],N=0;
function apply(data,first){
  COMM=data.comms.map(c=>({...c,c:commColor(c.key),members:[]}));
  comIndex=Object.fromEntries(COMM.map((c,i)=>[c.key,i]));
  nodes=data.nodes.map(n=>({...n,ci:comIndex[n.c]??0,links:[]}));
  edges=data.edges;
  edges.forEach(([a,b])=>{nodes[a].links.push(b);nodes[b].links.push(a)});
  nodes.forEach((n,i)=>COMM[n.ci].members.push(i));
  const fresh=[];
  if(first){
    ensureFree(Math.ceil(nodes.filter(n=>n.c!=='core').length*1.3));
    COMM.map((c,i)=>i).sort((a,b)=>COMM[b].members.length-COMM[a].members.length).forEach(ci=>{
      const cm=COMM[ci],mem=cm.members.slice().sort((a,b)=>nodes[b].links.length-nodes[a].links.length);
      if(cm.key==='core'){mem.forEach((ni,k)=>nodes[ni].pos=stemPoint(k,mem.length));return}
      const center=centers[cm.key]=newCenter();
      mem.forEach(ni=>{const c=nearestFree(center);nodes[ni].pos=c.p;nodes[ni].cand=c});
    });
  }else{
    const ids=new Set(nodes.map(n=>n.id));
    nodes.forEach(n=>{const g='?'+n.name.toLowerCase();
      if(!n.ghost&&!known.has(n.id)&&known.has(g)&&!ids.has(g)){known.set(n.id,known.get(g));known.delete(g)}});
    for(const[id,k]of known)if(!ids.has(id)){if(k.cand)k.cand.used=false;known.delete(id)}
    ensureFree(nodes.length-known.size);
    nodes.forEach((n,i)=>{const k=known.get(n.id);
      if(k){n.pos=k.pos;n.cand=k.cand;if(k.ghost&&!n.ghost)fresh.push(i);return}
      if(n.c==='core')n.pos=stemPoint(Math.floor(rnd()*40),40);
      else{if(!centers[n.c])centers[n.c]=newCenter();const c=nearestFree(centers[n.c]);n.pos=c.p;n.cand=c}
      if(!n.ghost)fresh.push(i);
    });
  }
  known.clear();
  nodes.forEach(n=>{known.set(n.id,{pos:n.pos,cand:n.cand,ghost:n.ghost});
    n.p=new THREE.Vector3(n.pos[0],n.pos[1],n.pos[2]).multiplyScalar(SCALE);
    n.size=n.ghost?1.6:2.2+Math.min(9,Math.sqrt(n.links.length)*1.6)});
  N=nodes.length;
  return fresh;
}

const W=()=>innerWidth,H=()=>innerHeight;
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setClearColor(0x000000,0);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(W(),H());
document.getElementById('stage').appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x03040a,.0011);
const cam=new THREE.PerspectiveCamera(55,W()/H(),1,4000);cam.position.set(470,110,250);
const controls=new THREE.OrbitControls(cam,renderer.domElement);
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
controls.enableDamping=true;controls.autoRotate=!calm;controls.autoRotateSpeed=.45;

function glowTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const r=g.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.18,'rgba(255,255,255,.85)');
  r.addColorStop(.42,'rgba(255,255,255,.22)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c)}
const tex=glowTex();
// focus=1 while a community is selected: its notes (hi=1) swell and pulse bright, everything else fades back.
// born = the moment a note arrived: it grows in from nothing with a bright flash that settles over ~4s.
const VS=`attribute float size;attribute float tw;attribute float hi;attribute float born;varying vec3 vC;varying float vA;uniform float t;uniform float focus;
  void main(){vC=color;vec4 mv=modelViewMatrix*vec4(position,1.);float s=size*(1.+.35*sin(t*2.2+tw));vA=.75+.25*sin(t*3.1+tw*1.7);
  if(focus>.5){if(hi>.5){s*=1.9+.5*sin(t*4.+tw);vA*=1.7;}else{s*=.9;vA*=.5;}}
  float age=t-born;if(age<4.){float k=exp(-age*1.4);s*=(1.+6.*k)*min(1.,age/.3+.02);vA*=1.+2.5*k;vC=mix(vC,vec3(1.),k*.8);}
  gl_PointSize=s*(520./-mv.z)*2.2;gl_Position=projectionMatrix*mv;}`;
const FS=`uniform sampler2D map;uniform float dim;varying vec3 vC;varying float vA;
  void main(){vec4 g=texture2D(map,gl_PointCoord);gl_FragColor=vec4(vC*vA*dim,g.a*min(vA,1.));}`;
function cloud(count,fill){
  const pos=new Float32Array(count*3),col=new Float32Array(count*3),siz=new Float32Array(count),tw=new Float32Array(count),hi=new Float32Array(count),born=new Float32Array(count).fill(-100);
  for(let i=0;i<count;i++){const o=fill(i);pos.set(o.p,i*3);col.set(o.c,i*3);siz[i]=o.s;tw[i]=rnd()*6.28;if(o.b!=null)born[i]=o.b}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  g.setAttribute('size',new THREE.BufferAttribute(siz,1));g.setAttribute('tw',new THREE.BufferAttribute(tw,1));
  g.setAttribute('hi',new THREE.BufferAttribute(hi,1));g.setAttribute('born',new THREE.BufferAttribute(born,1));
  const m=new THREE.ShaderMaterial({uniforms:{t:{value:0},map:{value:tex},dim:{value:1},focus:{value:0}},transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,vertexColors:true,vertexShader:VS,fragmentShader:FS});
  const pts=new THREE.Points(g,m);scene.add(pts);m.geo=g;m.pts=pts;return m;
}
// Brain dust: faint decorative specks that keep the brain's outline readable. Not notes.
const DUST=3200,dustMat=cloud(DUST,()=>{const p=cortexPoint(rnd()<.85).map(v=>v*SCALE),k=.5+rnd()*.35;return{p,c:[.5*k,.72*k,1*k],s:2+rnd()*2.4}});

const BASE_LINE=.055;
const lg=new THREE.BufferGeometry();
const lmat=new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:BASE_LINE,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.LineSegments(lg,lmat));
let noteMat=null,t=0;

// (Re)build the notes and links on the GPU. Long links that cut across the brain fade out
// (additive blending: darker = more see-through) so the lobes and outline stay readable.
function buildScene(fresh){
  const freshSet=new Set(fresh);
  if(noteMat){scene.remove(noteMat.pts);noteMat.geo.dispose();noteMat.dispose()}
  noteMat=cloud(N,i=>{const n=nodes[i],c=new THREE.Color(COMM[n.ci].c);
    if(n.ghost)c.lerp(new THREE.Color('#5a6478'),.7);else c.lerp(new THREE.Color('#ffffff'),Math.min(.5,n.links.length/40));
    return{p:[n.p.x,n.p.y,n.p.z],c:[c.r,c.g,c.b],s:n.size,b:freshSet.has(i)?t:null}});
  const lp=new Float32Array(edges.length*6),lc=new Float32Array(edges.length*6);
  edges.forEach(([a,b],k)=>{const A=nodes[a].p,B=nodes[b].p;lp.set([A.x,A.y,A.z,B.x,B.y,B.z],k*6);
    const f=.28+.72*Math.pow(Math.max(0,1-A.distanceTo(B)/(SCALE*.9)),2);
    const c1=new THREE.Color(COMM[nodes[a].ci].c).multiplyScalar(f),c2=new THREE.Color(COMM[nodes[b].ci].c).multiplyScalar(f);lc.set([c1.r,c1.g,c1.b,c2.r,c2.g,c2.b],k*6)});
  lg.setAttribute('position',new THREE.BufferAttribute(lp,3));lg.setAttribute('color',new THREE.BufferAttribute(lc,3));
  lg.computeBoundingSphere();
}

// Lightning: the hovered note's links flash white, sparks run along them
const hlMat=new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false});
const hl=new THREE.LineSegments(new THREE.BufferGeometry(),hlMat);scene.add(hl);
const MAXS=400,sp=new Float32Array(MAXS*3),sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
const smat=new THREE.PointsMaterial({size:9,map:tex,color:0xeaffff,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false});
scene.add(new THREE.Points(sg,smat));
let sparks=[];
function spark(a,b,speed){if(sparks.length<MAXS&&a!=null&&b!=null)sparks.push({a,b,u:0,v:speed||(.6+rnd()*.9)})}
function lightUp(list){const arr=new Float32Array(list.length*6);list.forEach(([a,b],k)=>{const A=nodes[a].p,B=nodes[b].p;arr.set([A.x,A.y,A.z,B.x,B.y,B.z],k*6)});
  hl.geometry.setAttribute('position',new THREE.BufferAttribute(arr,3))}

let hover=-1;const tip=document.getElementById('tip');
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function setHover(i,x,y){
  if(i===hover){if(i>=0)place(x,y);return}
  hover=i;renderer.domElement.style.cursor=i>=0&&!nodes[i].ghost?'pointer':'grab';
  if(i<0){tip.hidden=true;lightUp([]);lmat.opacity=lit>=0?.02:BASE_LINE;noteMat.uniforms.dim.value=1;return}
  const n=nodes[i];lightUp(n.links.map(j=>[i,j]));n.links.forEach(j=>spark(i,j,1.4));lmat.opacity=.025;noteMat.uniforms.dim.value=.7;
  tip.innerHTML=`${esc(n.name)}<small><i style="background:${COMM[n.ci].c}"></i>${esc(COMM[n.ci].label)}</small><small>${n.links.length} connection${n.links.length===1?'':'s'} · ${n.ghost?'not written yet':'<em>click to open</em>'}</small>`;
  tip.hidden=false;place(x,y);
}
function place(x,y){tip.style.left=Math.min(x+16,W()-300)+'px';tip.style.top=Math.min(y+12,H()-90)+'px'}
const v=new THREE.Vector3();
function pick(ex,ey){let best=-1,bd=196;
  for(let i=0;i<N;i++){v.copy(nodes[i].p).project(cam);if(v.z>1)continue;const sx=(v.x+1)/2*W(),sy=(1-v.y)/2*H(),d=(sx-ex)**2+(sy-ey)**2;if(d<bd){bd=d;best=i}}
  return best}
const el=renderer.domElement;
el.addEventListener('pointermove',e=>setHover(pick(e.clientX,e.clientY),e.clientX,e.clientY));
el.addEventListener('pointerleave',()=>setHover(-1));
// A click (not a drag) opens the note in Obsidian
let down=null;
el.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
el.addEventListener('pointerup',e=>{if(!down)return;const moved=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;
  if(moved>5)return;const i=pick(e.clientX,e.clientY);if(i>=0&&!nodes[i].ghost)post({type:'open',path:nodes[i].id,newTab:true})});

// Legend: click a community to make its notes glow and send sparks running along its links
// (no solid lines, so it stays clean); click it again to let go
const list=document.getElementById('list');let lit=-1,litKey=null,litEdges=[];
function focusCommunity(ci){
  const hi=noteMat.geo.attributes.hi;hi.array.fill(0);
  lit=ci;litKey=ci>=0?COMM[ci].key:null;litEdges=[];
  if(ci>=0){const set=new Set(COMM[ci].members);COMM[ci].members.forEach(i=>hi.array[i]=1);
    litEdges=edges.filter(([a,b])=>set.has(a)&&set.has(b));if(litEdges.length<12)litEdges=edges.filter(([a,b])=>set.has(a)||set.has(b));
    smat.color.set(COMM[ci].c).lerp(new THREE.Color('#ffffff'),.45);}
  else smat.color.set('#eaffff');
  hi.needsUpdate=true;noteMat.uniforms.focus.value=dustMat.uniforms.focus.value=ci>=0?1:0;lmat.opacity=ci>=0?.02:BASE_LINE;
  list.querySelectorAll('li').forEach(x=>x.classList.toggle('on',x.dataset.key===litKey));
}
function buildLegend(){
  list.replaceChildren();
  COMM.map((c,i)=>i).sort((a,b)=>COMM[b].members.length-COMM[a].members.length).forEach(ci=>{const c=COMM[ci],li=document.createElement('li');
    li.dataset.key=c.key;
    li.innerHTML=`<i style="background:${c.c};color:${c.c}"></i><span title="${esc(c.label)}">${esc(c.label)}</span><span>${c.members.length}</span>`;
    li.onclick=()=>focusCommunity(litKey===c.key?-1:comIndex[c.key]);
    list.appendChild(li)});
  document.getElementById('nN').textContent=nodes.filter(n=>!n.ghost).length.toLocaleString();
  document.getElementById('nE').textContent=edges.length.toLocaleString();
  document.getElementById('nC').textContent=COMM.length;
}
document.getElementById('hide').onclick=e=>{list.hidden=!list.hidden;e.target.textContent=list.hidden?'show':'hide'};
const rescan=document.getElementById('rescan');rescan.onclick=()=>post({type:'rescan'});
rescan.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')post({type:'rescan'})};

// Learning: new notes flash in, and sparks pour out along their links for a few seconds
let learning=[];const learnEl=document.getElementById('learn'),learnText=document.getElementById('learnText');let learnTimer=0;
function announce(fresh){
  if(!fresh.length)return;
  learning=fresh.map(i=>({i,until:t+4.5}));
  fresh.forEach(i=>nodes[i].links.forEach(j=>spark(i,j,.9)));
  const names=fresh.map(i=>nodes[i].name);
  learnText.textContent=names.slice(0,2).join(', ')+(names.length>2?` +${names.length-2} more`:'');
  learnEl.classList.add('show');clearTimeout(learnTimer);learnTimer=setTimeout(()=>learnEl.classList.remove('show'),5500);
}
function update(data){
  const keepKey=litKey;
  hover=-1;tip.hidden=true;lightUp([]);sparks=[];learning=[];
  const fresh=apply(data,false);buildScene(fresh);buildLegend();
  focusCommunity(keepKey!=null&&keepKey in comIndex?comIndex[keepKey]:-1);
  announce(fresh);
}
addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data;
  if(m&&m.src==='brain-graph-host'&&m.type==='update'&&m.data)update(m.data)});

apply(DATA,true);buildScene([]);buildLegend();

// Living sky: twinkling stars and the odd shooting star, kept faint behind the brain
const sky=document.getElementById('stars'),sx=sky.getContext('2d');
let twinkles=[],meteors=[];
function sizeSky(){sky.width=W()*devicePixelRatio;sky.height=H()*devicePixelRatio;sx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  twinkles=Array.from({length:Math.round(W()*H()/5000)},()=>({x:Math.random()*W(),y:Math.random()*H(),r:.4+Math.random()*1.3,
    p:Math.random()*6.28,s:.6+Math.random()*2.2,c:['#ffffff','#cfe0ff','#ffd9a8','#a9c4ff'][Math.floor(Math.random()*4)]}))}
sizeSky();
function meteor(){const fromTop=Math.random()<.7,x=fromTop?Math.random()*W():W()*(.6+Math.random()*.4),y=fromTop?-20:Math.random()*H()*.4;
  const a=Math.PI*(.72+Math.random()*.12),s=650+Math.random()*500;
  meteors.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0,max:.7+Math.random()*.6,len:90+Math.random()*120})}
let nextMeteor=1.5;
function drawSky(dt,t){
  sx.clearRect(0,0,W(),H());
  for(const s of twinkles){const a=.12+.38*(.5+.5*Math.sin(t*s.s+s.p));sx.globalAlpha=a;sx.fillStyle=s.c;
    sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.283);sx.fill();
    if(s.r>1.4&&a>.45){sx.globalAlpha=a*.35;sx.fillRect(s.x-s.r*4,s.y-.3,s.r*8,.6);sx.fillRect(s.x-.3,s.y-s.r*4,.6,s.r*8)}}
  if(!calm&&(nextMeteor-=dt)<=0){meteor();if(Math.random()<.2)meteor();nextMeteor=2+Math.random()*4.5}
  meteors=meteors.filter(m=>(m.life+=dt)<m.max);
  for(const m of meteors){m.x+=m.vx*dt;m.y+=m.vy*dt;const k=1-m.life/m.max,n=Math.hypot(m.vx,m.vy);
    const tx=m.x-m.vx/n*m.len,ty=m.y-m.vy/n*m.len,g=sx.createLinearGradient(m.x,m.y,tx,ty);
    g.addColorStop(0,`rgba(235,245,255,${.95*k})`);g.addColorStop(1,'rgba(235,245,255,0)');
    sx.globalAlpha=1;sx.strokeStyle=g;sx.lineWidth=1.6;sx.beginPath();sx.moveTo(m.x,m.y);sx.lineTo(tx,ty);sx.stroke();
    sx.fillStyle=`rgba(255,255,255,${k})`;sx.beginPath();sx.arc(m.x,m.y,1.6,0,6.283);sx.fill()}
  sx.globalAlpha=1;
}

// F toggles full screen. Inside Obsidian the plugin does it (the page is boxed in a frame);
// opened on its own, the page does it itself.
addEventListener('keydown',e=>{
  if(e.key!=='f'&&e.key!=='F'||e.ctrlKey||e.metaKey||e.altKey)return;
  if(parent!==window){post({type:'fullscreen'});return}
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  else document.documentElement.requestFullscreen?.().catch(()=>{});
});
// Keys only reach the page once it has focus, so take it when the pointer comes in
addEventListener('pointerenter',()=>window.focus());
addEventListener('resize',()=>{cam.aspect=W()/H();cam.updateProjectionMatrix();renderer.setSize(W(),H());sizeSky()});

const clock=new THREE.Clock();
(function loop(){
  const dt=Math.min(clock.getDelta(),.05);t+=dt;noteMat.uniforms.t.value=dustMat.uniforms.t.value=t;drawSky(dt,t);
  if(edges.length&&rnd()<.5){const e=edges[Math.floor(rnd()*edges.length)];spark(e[0],e[1])}  // the brain "thinking"
  if(lit>=0&&litEdges.length)for(let k=0;k<3;k++){const e=litEdges[Math.floor(rnd()*litEdges.length)];rnd()<.5?spark(e[0],e[1],1.1):spark(e[1],e[0],1.1)}
  if(hover>=0&&nodes[hover].links.length&&rnd()<.25){const n=nodes[hover];spark(hover,n.links[Math.floor(rnd()*n.links.length)],1.4)}
  learning=learning.filter(l=>l.until>t);
  for(const l of learning){const n=nodes[l.i];if(n.links.length&&rnd()<.5){const j=n.links[Math.floor(rnd()*n.links.length)];rnd()<.6?spark(l.i,j,1):spark(j,l.i,1)}}
  sparks=sparks.filter(s=>(s.u+=s.v*dt)<1);
  sparks.forEach((s,k)=>{v.copy(nodes[s.a].p).lerp(nodes[s.b].p,s.u);sp.set([v.x,v.y,v.z],k*3)});
  sg.setDrawRange(0,sparks.length);sg.attributes.position.needsUpdate=true;
  hlMat.opacity=.55+.35*Math.sin(t*9);
  controls.update();renderer.render(scene,cam);requestAnimationFrame(loop);
})();
</script>
